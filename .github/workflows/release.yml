name: Release

# Fully automated releases, with a human review step before anything is published:
#
#   1. Commits with Conventional Commit prefixes (fix:, feat:, ...) land on main.
#   2. release-please keeps a "Release PR" open: it bumps the version (package.json, Cargo.toml, Cargo.lock),
#      writes CHANGELOG.md and shows what the next version will be.
#   3. Merging the Release PR makes release-please create the tag and a DRAFT GitHub Release.
#   4. The `build` job below runs in the same workflow run (see why in docs/releasing.md): it builds the
#      installer, signs the updater artifacts and uploads installer, .sig and latest.json to the draft.
#   5. You test the draft and click Publish. The in-app updater only sees published releases.
#
# The build is a job of this workflow, not a separate workflow started by the tag: events made with the
# default GITHUB_TOKEN (the tag, the release) never start other workflows.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Rebuild the installer for an existing draft release (for example v0.1.1), after a failed build"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Pinned to a commit (v5.0.0). RELEASE_PLEASE_TOKEN is optional: with the default token the Release PR
      # does not run CI (GitHub does not start workflows for events made by GITHUB_TOKEN).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || inputs.tag != '' }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          path: owll

      # Fail early and clearly instead of publishing updater artifacts that cannot be verified.
      - name: Check the updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] && missing="$missing TAURI_SIGNING_PRIVATE_KEY"
          [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] && missing="$missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Updater signing secrets missing::Add these repository secrets (Settings > Secrets and variables > Actions):$missing. See docs/releasing.md. Nothing was built or published."
            exit 1
          fi
          if grep -q "REPLACE_WITH" owll/src-tauri/tauri.conf.json; then
            echo "::error title=Updater public key missing::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder. See docs/releasing.md."
            exit 1
          fi

      # package.json is the one version source: tauri.conf.json reads it, and release-please keeps Cargo.toml
      # and Cargo.lock in step. This only catches a drift that release-please should have prevented.
      - name: Check that the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./owll/package.json').version")
          cargo=$(grep -m1 '^version' owll/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          lock=$(grep -A1 '^name = "owll"$' owll/Cargo.lock | grep -m1 '^version' | sed 's/.*"\(.*\)".*/\1/')
          tag="${TAG#v}"
          if [ "$version" != "$tag" ] || [ "$cargo" != "$tag" ] || [ "$lock" != "$tag" ]; then
            echo "::error title=Version mismatch::Tag is $TAG but package.json=$version, Cargo.toml=$cargo, Cargo.lock=$lock."
            exit 1
          fi

      - name: Read the pinned dawn-core ref
        id: ref
        shell: bash
        run: echo "ref=$(grep -v '^#' owll/dawn-core.ref | grep -v '^[[:space:]]*$' | head -n1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Refuse to release against a moving dawn-core
        if: steps.ref.outputs.ref == 'main'
        shell: bash
        run: |
          echo "::error title=dawn-core.ref is 'main'::Put a dawn-core commit SHA or tag in dawn-core.ref before releasing, so the build is reproducible."
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: Second-Dawn-Lab/dawn-core
          ref: ${{ steps.ref.outputs.ref }}
          path: dawn-core
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: owll/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: owll
          shared-key: windows-dnnl
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
        working-directory: dawn-core
      - run: pnpm install --frozen-lockfile
        working-directory: owll

      # createUpdaterArtifacts is off in tauri.conf.json so local builds need no key; src-tauri/tauri.release.conf.json
      # switches it on. A file path (relative to working-directory) is used because PowerShell, the default
      # shell on Windows runners, strips the quotes from inline JSON.
      - name: Build the installer and sign the updater artifacts
        working-directory: owll
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Write latest.json
        shell: bash
        working-directory: owll
        run: |
          installer=$(ls target/release/bundle/nsis/*-setup.exe | head -n1)
          test -f "$installer.sig" || { echo "::error::$installer.sig was not produced; is createUpdaterArtifacts on?"; exit 1; }
          node scripts/make-latest-json.mjs "$TAG" "$installer" "$installer.sig" release-out
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"

      # The draft release already exists (release-please made it); its notes are release-please's.
      - name: Upload the installer, its signature and latest.json to the draft release
        shell: bash
        working-directory: owll
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$INSTALLER" "$INSTALLER.sig" release-out/latest.json --clobber --repo "$GITHUB_REPOSITORY"
