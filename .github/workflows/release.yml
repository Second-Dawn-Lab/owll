name: Release

# Push a tag such as v0.1.0 to build the Windows installer, sign the updater artifacts and create a
# DRAFT GitHub Release with the installer, its .sig file and latest.json. Review the draft, then publish it
# (the in-app updater only sees published releases). See docs/releasing.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: owll

      # Fail early and clearly instead of publishing updater artifacts that cannot be verified.
      - name: Check the updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] && missing="$missing TAURI_SIGNING_PRIVATE_KEY"
          [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] && missing="$missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Updater signing secrets missing::Add these repository secrets (Settings > Secrets and variables > Actions):$missing. See docs/releasing.md, section 1. Nothing was built or published."
            exit 1
          fi
          if grep -q "REPLACE_WITH" owll/src-tauri/tauri.conf.json; then
            echo "::error title=Updater public key missing::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder. See docs/releasing.md, section 1."
            exit 1
          fi

      - name: Check that the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./owll/package.json').version")
          conf=$(node -p "require('./owll/src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' owll/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ] || [ "$conf" != "$tag" ] || [ "$cargo" != "$tag" ]; then
            echo "::error title=Version mismatch::Tag is $GITHUB_REF_NAME but package.json=$version, tauri.conf.json=$conf, Cargo.toml=$cargo."
            exit 1
          fi

      - name: Read the pinned dawn-core ref
        id: ref
        shell: bash
        run: echo "ref=$(grep -v '^#' owll/dawn-core.ref | grep -v '^[[:space:]]*$' | head -n1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Refuse to release against a moving dawn-core
        if: steps.ref.outputs.ref == 'main'
        shell: bash
        run: |
          echo "::error title=dawn-core.ref is 'main'::Put a dawn-core commit SHA or tag in dawn-core.ref before releasing, so the build is reproducible."
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: Second-Dawn-Lab/dawn-core
          ref: ${{ steps.ref.outputs.ref }}
          path: dawn-core
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: owll/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: owll
          shared-key: windows-dnnl
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
        working-directory: dawn-core
      - run: pnpm install --frozen-lockfile
        working-directory: owll

      # createUpdaterArtifacts is off in tauri.conf.json so local builds need no key; it is switched on here.
      - name: Build the installer and sign the updater artifacts
        working-directory: owll
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Write latest.json and the release notes
        shell: bash
        working-directory: owll
        run: |
          installer=$(ls target/release/bundle/nsis/*-setup.exe | head -n1)
          test -f "$installer.sig" || { echo "::error::$installer.sig was not produced; is createUpdaterArtifacts on?"; exit 1; }
          node scripts/make-latest-json.mjs "$GITHUB_REF_NAME" "$installer" "$installer.sig" release-out
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"

      - name: Create the draft GitHub Release
        shell: bash
        working-directory: owll
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$INSTALLER" "$INSTALLER.sig" release-out/latest.json \
            --repo "$GITHUB_REPOSITORY" --draft --title "Owl-L $GITHUB_REF_NAME" --notes-file release-out/release-notes.md
