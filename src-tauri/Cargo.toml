[package]
name = "owll"
description = "Owl-L: offline, lightweight translator"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "owll_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
# A second launch focuses the running window instead of starting another tray icon.
tauri-plugin-single-instance = "2"
# Update checks against the latest GitHub release, and the restart after installing one.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The "Save as" and "Choose file" dialogs of the Files tab (document translation).
tauri-plugin-dialog = "2"
# Reads the copied text for quick access (text only, so no image support is compiled in).
# "image-data" lets Ctrl+C+C read an image on the clipboard (it is then recognized as text).
arboard = { version = "3", default-features = false, features = ["image-data"] }
# Decodes the image files opened in the Images tab (PNG, JPEG, BMP, WebP, GIF).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dawn-core = { path = "../../dawn-core/crates/dawn-core" }
dawn-docs = { path = "../../dawn-core/crates/dawn-docs" }
dawn-capture = { path = "../../dawn-core/crates/dawn-capture" }
dawn-hotkeys = { path = "../../dawn-core/crates/dawn-hotkeys" }
dawn-models = { path = "../../dawn-core/crates/dawn-models" }
dawn-ocr = { path = "../../dawn-core/crates/dawn-ocr" }
dawn-translate = { path = "../../dawn-core/crates/dawn-translate" }

# Turns off WebView2's built-in browser shortcuts (Ctrl+Shift+O opens its bookmarks, F5 reloads, Ctrl+P prints)
# in Owl-L's windows. The same versions Tauri itself uses, so nothing new is compiled.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

# Snap Layouts for the custom title bar (see src/titlebar.rs): window hit testing needs Win32.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
